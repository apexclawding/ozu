<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a3e"/>
      <stop offset="1" stop-color="#0e0a1c"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6d5aa8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d5aa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS squircle plate: 824x824 centered -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- waveform -->
  <g fill="url(#wave)">
    <rect x="240" y="412" width="44" height="140" rx="22"/>
    <rect x="316" y="352" width="44" height="260" rx="22"/>
    <rect x="392" y="272" width="44" height="420" rx="22"/>
    <rect x="468" y="322" width="44" height="320" rx="22"/>
    <rect x="544" y="232" width="44" height="500" rx="22"/>
    <rect x="620" y="342" width="44" height="280" rx="22"/>
    <rect x="696" y="302" width="44" height="360" rx="22"/>
    <rect x="772" y="402" width="44" height="160" rx="22"/>
  </g>

  <!-- .md wordmark -->
  <text x="512" y="862" font-family="Menlo, SF Mono, monospace" font-size="120"
        font-weight="bold" fill="#ffffff" fill-opacity="0.55"
        text-anchor="middle">.md</text>
</svg>

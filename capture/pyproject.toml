[project]
name = "ozu-capture"
version = "0.1.0"
description = "Voice memos and YouTube captions into an Ozu vault, transcribed on-device"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sergio dos Santos" }]
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
ozu-capture = "ozu_capture.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozu_capture"]

# Ozu MCP behind Caddy — reaching your vault from Claude.ai, not just this box.
#
# The endpoint authenticates itself: `ozu mcp --http` refuses to start without
# OZU_MCP_TOKEN and answers 401 to any request that does not carry it. So
# Caddy's whole job here is TLS and forwarding — do NOT add a basicauth block,
# and do not treat one as a substitute for the token.
#
# ozu-mcp binds 127.0.0.1:8321 and stays there. The port never listens on a
# public interface; Caddy reaches it over loopback.
#
# Two settings in ~/ozu-data/.env go with this file:
#   OZU_MCP_TOKEN       — without it ozu-mcp refuses to start at all
#   OZU_MCP_PUBLIC_URL  — https://ozu.example.com (the name below)
# The public URL matters twice: it is what the 401 advertises as its metadata
# location, and mcp_server.transport_security() derives the allowed Host from
# it. Behind a proxy the Host header is the public name while the server binds
# loopback, and the MCP SDK answers 421 to that mismatch — and only to
# *authenticated* requests, so a wrong public URL looks healthy from outside.
# Never "fix" a 421 by disabling DNS-rebinding protection; set the URL.
#
# Install:
#   sudo cp deploy/caddy-mcp.conf /etc/caddy/ozu-mcp.caddy
#   # append to /etc/caddy/Caddyfile:  import ozu-mcp.caddy
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
# Then, from another machine:
#   curl -s -o /dev/null -w '%{http_code}\n' https://ozu.example.com/mcp   # 401
#
# A 401 is the check that matters: it proves the route is live AND that it is
# not serving the vault to whoever asks.

ozu.example.com {
	encode gzip

	reverse_proxy 127.0.0.1:8321 {
		# streamable-http holds a response open for the length of a tool
		# call. Buffering would sit on the stream and the default write
		# timeout would cut a slow call off mid-answer.
		flush_interval -1
		transport http {
			read_timeout 300s
			write_timeout 300s
		}
	}
}
